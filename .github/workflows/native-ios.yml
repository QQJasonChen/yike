# Builds the locked patched native framework; does not sign or distribute an app.
# Standard runner is free while QQJasonChen/yike remains public. No larger runner,
# package publication, artifact upload/cache, credentials, signing or distribution.
name: Verify native iOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-ios:
    name: Native iOS unsigned build
    # Exact JSON avoids a missing/null field being coerced to false.
    if: ${{ github.repository == 'QQJasonChen/yike' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      COCOAPODS_DISABLE_STATS: 'true'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Select locked CocoaPods 1.16.2
        shell: bash
        run: |
          set -euo pipefail
          gem install cocoapods --version 1.16.2 --no-document --clear-sources --source https://rubygems.org
          YIKE_NATIVE_POD_BIN="$RUNNER_TEMP/yike-native-pod-bin"
          mkdir -p "$YIKE_NATIVE_POD_BIN"
          cat > "$YIKE_NATIVE_POD_BIN/pod" <<'RUBY'
          #!/usr/bin/env ruby
          require 'rubygems'
          load Gem.activate_bin_path('cocoapods', 'pod', '=1.16.2')
          RUBY
          chmod 0755 "$YIKE_NATIVE_POD_BIN/pod"
          echo "$YIKE_NATIVE_POD_BIN" >> "$GITHUB_PATH"
          test "$("$YIKE_NATIVE_POD_BIN/pod" --version)" = '1.16.2'
      - name: Verify existing native toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 26.2'
          xcrun --sdk iphonesimulator --show-sdk-version
          pod --version | grep -Fx '1.16.2'
          df -h "$RUNNER_TEMP"
      - name: Install locked public dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Known dependency vulnerability gate
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Build native web assets and TypeScript
        env:
          CAP_BUILD: '1'
        run: npm run build
      - name: Actual Capacitor sync and locked Pods install
        run: node node_modules/@capacitor/cli/bin/capacitor sync ios --deployment
      - name: Verify actual installed patched framework versions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          for (const name of ['Capacitor', 'CapacitorCordova']) {
            const p = JSON.parse(fs.readFileSync(`ios/App/Pods/Local Podspecs/${name}.podspec.json`, 'utf8'));
            assert.equal(p.version, '8.5.3');
          }
          assert.deepEqual(fs.readFileSync('ios/App/Podfile.lock'), fs.readFileSync('ios/App/Pods/Manifest.lock'));
          JS
          git diff --exit-code -- ios/App/Podfile.lock
      - name: Unsigned iOS Simulator build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/yike-native-derived" \
            -resultBundlePath "$RUNNER_TEMP/yike-native-build.xcresult" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/yike-native-build.log"
      - name: Diagnose public podspec metadata after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          gem 'cocoapods', '=1.16.2'
          require 'cocoapods'
          require 'json'
          require 'digest'
          canonical = lambda do |value|
            case value
            when Hash then value.keys.sort.to_h { |key| [key, canonical.call(value[key])] }
            when Array then value.map { |item| canonical.call(item) }
            else value
            end
          end
          puts JSON.pretty_generate({
            ruby: RUBY_DESCRIPTION,
            loaded_gems: %w[cocoapods cocoapods-core json activesupport xcodeproj].to_h { |name| [name, Gem.loaded_specs[name]&.version&.to_s] }
          })
          packages = {
            'Capacitor' => ['@capacitor/ios', 'Capacitor.podspec'],
            'CapacitorLocalNotifications' => ['@capacitor/local-notifications', 'CapacitorLocalNotifications.podspec'],
            'RevenuecatPurchasesCapacitor' => ['@revenuecat/purchases-capacitor', 'RevenuecatPurchasesCapacitor.podspec']
          }
          lock = File.read('ios/App/Podfile.lock')
          packages.each do |name, (package, podspec)|
            package_path = File.join('node_modules', package)
            package_version = JSON.parse(File.read(File.join(package_path, 'package.json'))).fetch('version')
            source_path = File.join(package_path, podspec)
            source_spec = Pod::Specification.from_file(source_path)
            source_json = source_spec.to_pretty_json
            target_path = File.join('ios/App/Pods/Local Podspecs', "#{name}.podspec.json")
            record = {
              pod: name, package_version: package_version,
              source_podspec_sha256: Digest::SHA256.file(source_path).hexdigest,
              source_generated_json_sha1: Digest::SHA1.hexdigest(source_json),
              source_parsed_spec: JSON.parse(source_json),
              lock_checksum: lock.match(/^  #{Regexp.escape(name)}: ([0-9a-f]{40})$/)&.captures&.first
            }
            if File.file?(target_path)
              bytes = File.binread(target_path)
              parsed = JSON.parse(bytes)
              record[:generated_target] = {
                sha1: Digest::SHA1.hexdigest(bytes), sha256: Digest::SHA256.hexdigest(bytes),
                canonical_semantic_sha256: Digest::SHA256.hexdigest(JSON.generate(canonical.call(parsed))),
                parsed_spec: parsed
              }
            else
              record[:generated_target] = { status: 'not-generated' }
            end
            puts JSON.pretty_generate(record)
          end
          RUBY
