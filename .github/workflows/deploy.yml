name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      upload_pages_artifact: true

  build-deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 (official verified ref 2026-10-14)
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (official verified ref 2026-10-14)
      - name: 觸發公司鏡像即時同步
        env:
          GH_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
        run: gh workflow run deploy.yml -R QQJasonChen/yike-mirror
        continue-on-error: true
