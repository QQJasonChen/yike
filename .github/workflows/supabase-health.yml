# Public metadata/reachability only. Not complete purchase monitoring or proof of notification delivery.
# Anonymous journal HEAD must report exact zero visible rows; no response body is read.
name: Supabase 保活與健康檢查

on:
  schedule:
    - cron: '17 * * * *' # 每小時；GitHub 排程可能延遲
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; existing repository pin
        with:
          node-version: '22'
      - name: 匿名資料隔離與 Gumroad 開通端點可達性
        run: node scripts/public-health-probe.mjs
