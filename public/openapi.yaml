openapi: 3.1.0
info:
  title: 一刻手帳 Yike — 給 AI 助理的唯讀 API
  version: "1.0.0"
  description: |
    讀取使用者自己的手帳（每日／週／月／季／年／願景／獲利模式圖／設定）。**只讀，沒有寫入。**
    token 由使用者在 app「設定 → 給 AI 助理的唯讀存取」產生（`yk_` 開頭），可隨時撤銷。
    解讀每日手帳的 `answers`（反思回答）之前，一定要先讀 `/entry/pp:settings`：
    `m0`/`e1` 這種 key 是問題 id，問題文字在 settings 的 `morningQs`／`eveningQs`。
    完整欄位說明：`/schema`（JSON）或 https://yikeday.com/llms.txt。
servers:
  - url: https://ofhupqifavtafiylehkj.supabase.co/functions/v1/agent-api
components:
  securitySchemes:
    yikeToken:
      type: http
      scheme: bearer
      description: 使用者在 app 設定頁產生的 yk_ token
  schemas:
    Row:
      type: object
      properties:
        key: { type: string, description: "例如 pp:day:2026-10-22" }
        updated_at: { type: string, format: date-time }
        entry: { description: "該 key 的 JSON 內容；結構見 /schema" }
security:
  - yikeToken: []
paths:
  /schema:
    get:
      operationId: getSchema
      summary: 資料模型說明（JSON，不需要 token）
      security: []
      responses:
        "200": { description: 欄位與意義 }
  /me:
    get:
      operationId: whoAmI
      summary: 確認 token 有效
      responses:
        "200": { description: "{ ok, label, scope, created_at }" }
        "401": { description: token 無效或已撤銷 }
  /keys:
    get:
      operationId: listKeys
      summary: 這個帳號有哪些 key（不含內容）
      responses:
        "200": { description: "{ keys: [{ key, updated_at }] }" }
  /day/{date}:
    get:
      operationId: getDay
      summary: 某一天的手帳
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
          description: 使用者裝置的本地日期 YYYY-MM-DD
      responses:
        "200":
          description: 單日
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Row"
                  - type: object
                    properties: { date: { type: string } }
        "404": { description: 這一天沒有記錄 }
  /days:
    get:
      operationId: getDays
      summary: 一段日期的每日手帳（最多 92 天）
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string }
        - in: query
          name: to
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{ from, to, days: [{ date, key, updated_at, entry }] }"
        "400": { description: 日期格式不對、from 晚於 to、或超過 92 天 }
  /entry/{key}:
    get:
      operationId: getEntry
      summary: 任何一筆非每日的資料
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
          description: pp:settings、pp:week:<週一日期>、pp:month:YYYY-MM、pp:quarter:YYYY-Qn、pp:year:YYYY、pp:life、pp:bizmodel
      responses:
        "200":
          description: 單筆
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Row" }
        "404": { description: 沒有這筆、或這個 key 不開放讀取 }
